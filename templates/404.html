{% extends "base.html" %}
{% load static %}

{% block title %}Page Not Found | Mallava{% endblock %}

{% block content %}
<style>
    .error-page-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 400px);
        text-align: center;
        padding: 4rem 1rem;
    }

    .error-content {
        max-width: 600px;
        background: #fff;
        padding: 4rem 3rem;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        position: relative;
        overflow: hidden;
    }

    /* Abstract background decoration */
    .error-content::before {
        content: '';
        position: absolute;
        top: -50px;
        right: -50px;
        width: 150px;
        height: 150px;
        background: rgba(0, 123, 255, 0.05);
        border-radius: 50%;
    }

    .error-content::after {
        content: '';
        position: absolute;
        bottom: -50px;
        left: -50px;
        width: 150px;
        height: 150px;
        background: rgba(40, 167, 69, 0.05);
        border-radius: 50%;
    }

    .error-code {
        font-size: 8rem;
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, var(--primary-color), #6610f2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
        position: relative;
        z-index: 1;
    }

    .error-title {
        font-size: 2rem;
        color: var(--dark-color);
        margin-bottom: 1rem;
        position: relative;
        z-index: 1;
    }

    .error-message {
        font-size: 1.1rem;
        color: var(--secondary-color);
        margin-bottom: 2.5rem;
        line-height: 1.6;
        position: relative;
        z-index: 1;
    }

    .error-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        position: relative;
        z-index: 1;
    }

    .btn-return {
        padding: 0.85rem 2rem;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }

    .btn-return-home {
        background: var(--primary-color);
        color: white;
    }

    .btn-return-home:hover {
        background: #0056b3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
    }

    .btn-return-back {
        background: #f8f9fa;
        color: var(--dark-color);
        border: 1px solid #ddd;
    }

    .btn-return-back:hover {
        background: #e9ecef;
        transform: translateY(-2px);
    }

    @media (max-width: 576px) {
        .error-code {
            font-size: 6rem;
        }
        .error-title {
            font-size: 1.5rem;
        }
        .error-actions {
            flex-direction: column;
        }
    }
</style>

<div class="error-page-container">
    <div class="error-content">
        <div class="error-code">404</div>
        <h1 class="error-title">Oops! Page Not Found</h1>
        <p class="error-message">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <div class="error-actions">
            <a href="javascript:history.back()" class="btn-return btn-return-back">
                <i class="fas fa-arrow-left"></i> Go Back
            </a>
            <a href="{% url 'home' %}" class="btn-return btn-return-home">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
